services:
  mongodb:
    image: mongo:7.0
    container_name: medinsight_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: medinsight
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medinsight_backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: medinsight
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ML_MODEL_PATH: app/ml/artifacts/model.joblib
      ML_MODEL_TYPE: ensemble
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medinsight_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  mongodb_data:
