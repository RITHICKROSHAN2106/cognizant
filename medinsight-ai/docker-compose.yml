services:
  postgres:
    image: postgres:16-alpine
    container_name: medinsight_postgres
    restart: always
    environment:
      POSTGRES_USER: medinsight
      POSTGRES_PASSWORD: medinsight123
      POSTGRES_DB: medinsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinsight -d medinsight_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medinsight_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medinsight:medinsight123@postgres:5432/medinsight_db
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-in-production-min-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ML_MODEL_PATH: app/ml/artifacts/model.joblib
      ML_MODEL_TYPE: demo
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medinsight_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
